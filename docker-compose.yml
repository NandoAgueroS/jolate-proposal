version: "2"
services:
  php:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./backend/uploads:/var/www/html/uploads
      - ./backend/logs:/var/www/html/logs
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_COMMITTEE_EMAILS: ${SMTP_COMMITTEE_EMAILS}
    depends_on:
      - mailhog

  # Mail catcher for local dev — captures all outbound mail, no real SMTP needed.
  # Web UI: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
      - "1025:1025"
