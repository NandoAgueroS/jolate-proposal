services:
  db:
    image: mysql:8.0.20
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  php:
    build: .
    ports:
      - "8080:80"
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_COMMITTEE_EMAILS: ${SMTP_COMMITTEE_EMAILS}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        app_dir=/var/www/html/jolate-proposal
        cp -f "$$app_dir/backend/config.example.php" "$$app_dir/backend/config.php"
        chown -R www-data:www-data "$$app_dir/backend/uploads" "$$app_dir/backend/logs" "$$app_dir/backend/certificados"
        chmod 0755 "$$app_dir/backend/uploads" "$$app_dir/backend/logs" "$$app_dir/backend/certificados"
        php "$$app_dir/backend/config.php"
        exec apache2-foreground

  # Mail catcher for local dev — captures all outbound mail, no real SMTP needed.
  # Web UI: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
      - "1025:1025"

  # Web UI for MySQL — dev convenience: http://localhost:8081
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: "3306"
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASS}
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
