# Expose uploaded PDFs at a clean /uploads/ URL while they live in backend/uploads/.
# Loaded via /etc/apache2/conf-enabled/ (Apache 2.4 compatible syntax).
Alias /uploads/ /var/www/html/jolate-proposal/backend/uploads/

<Directory /var/www/html/jolate-proposal/backend/uploads>
    AllowOverride All
    Require all granted
</Directory>
